    <script>
      // Safeguard against 'Cannot set property fetch of #<Window> which has only a getter'
      (function () {
        try {
          var originalFetch = window.fetch;
          var customFetch = typeof originalFetch === 'function' ? originalFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return customFetch || originalFetch;
            },
            set: function (newFetch) {
              customFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // Ignore if environment prevents redefinition
        }
      })();
    </script>
